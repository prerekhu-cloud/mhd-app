<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f4ebe2">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="mhdGO">
<meta name="description" content="mhdGO – MHD, regionální autobusy a vlaky celé České republiky: živé polohy, odjezdy, vyhledávání spojení, 3D mapa a bedekr.">
<title>mhdGO – doprava v celé ČR</title>
<link rel="icon" type="image/png" sizes="96x96" href="data:image/png;base64,@ICON96@">
<link rel="apple-touch-icon" href="data:image/png;base64,@ICON512@">
<link rel="manifest" href="manifest.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<link rel="stylesheet" href="https://api.mapbox.com/mapbox-gl-js/v3.15.0/mapbox-gl.css">
<style>
/*@SPLASHCSS@*/
</style>
<style>
/*@CSS@*/
</style>
</head>
<body>
<div id="splash" role="status" aria-live="polite" aria-label="Načítám mhdGO">
 <div class="sp-glow"></div>
 <svg class="sp-cz" viewBox="@CZVIEW@" aria-hidden="true"><path pathLength="1" d="@CZPATH@"/></svg>
 <div class="sp-box">
  <div class="sp-logo">@LOGO@<svg class="sp-draw" viewBox="0 0 64 64" aria-hidden="true"><g fill="none" stroke="#fff" stroke-width="2.7" stroke-linecap="round" stroke-linejoin="round"><path id="sp-s" pathLength="1" d="M36.3 25.6H28.9a3.2 3.2 0 0 0 0 6.4h6.2a3.2 3.2 0 0 1 0 6.4H27.7"/><circle class="n1" cx="38.9" cy="25.6" r="2.6"/><circle class="n2" cx="25.1" cy="38.4" r="2.6"/></g><circle class="sp-bus" r="1.9" fill="#ffd8bd"><animateMotion dur="1.6s" begin="0.9s" repeatCount="indefinite" path="M36.3 25.6H28.9a3.2 3.2 0 0 0 0 6.4h6.2a3.2 3.2 0 0 1 0 6.4H27.7"/></circle></svg></div>
  <div class="sp-name"><span>mhd</span><b>GO</b></div>
  <div class="sp-sub">Doprava v celé České republice</div>
  <div class="sp-bar"><i></i></div>
  <div class="sp-stage" id="sp-stage">Spouštím…</div>
 </div>
</div>

<div id="app">
 <header id="hdr" class="glass">
  <div class="brand"><div class="brand-ic" id="brand" title="O aplikaci mhdGO">@LOGO@</div><div class="brand-tt"><div class="brand-tx" id="brand-tx">mhd<b>GO</b></div><button id="hdr-wx" type="button" title="Počasí" hidden></button></div></div>
  <div class="hdr-sp"></div>
  <nav class="hdr-btns" aria-label="Funkce">
   <button class="rb" data-a="search" title="Hledat zastávku, adresu nebo spojení"><i class="fa-solid fa-magnifying-glass"></i></button>
   <button class="rb" data-a="dep" title="Odjezdy ze zastávky"><i class="fa-regular fa-clock"></i><em>Odjezdy</em></button>
   <button class="rb" data-a="bedekr" title="Bedekr – památky a zajímavosti"><i class="fa-solid fa-landmark"></i><em>Bedekr</em></button>
   <button class="rb" data-a="info" title="O aplikaci"><i class="ri">i</i><em>Info</em></button>
   <button class="rb" data-a="dark" title="Tmavý režim"><i class="fa-solid fa-moon"></i><em>Tmavý</em></button>
   <button class="rb" data-a="ai" title="Rádce – zeptej se na cestu"><i class="fa-solid fa-wand-magic-sparkles"></i><em>Rádce</em></button>
   <button class="rb" data-a="wx" title="Počasí"><i class="fa-solid fa-cloud-sun"></i><em>Počasí</em></button>
   <span class="hb-sep"></span>
   <button class="rb tg" data-a="regio" title="Regionální linky"><i class="fa-solid fa-bus-simple"></i><em>Regio</em></button>
   <button class="rb tg" data-a="vlak" title="Vlaky"><i class="fa-solid fa-train"></i><em>Vlak</em></button>
  </nav>
  <div class="mode-sw" role="tablist" aria-label="Režim mapy">
   <button id="m-2d" class="on" title="Mapa 2D"><i class="fa-regular fa-map"></i><span>Mapa 2D</span></button>
   <button id="m-3d" title="Model 3D"><i class="fa-solid fa-cube"></i><span>Model 3D</span></button>
  </div>
 </header>
 <main id="mapwrap">
  <div id="map"></div>
  <div id="map3d"></div>
  <div class="hud hud-tl">
   <div class="zoomgrp"><button class="hbtn" id="z-in" title="Přiblížit">+</button><button class="hbtn" id="z-out" title="Oddálit">−</button></div>
  </div>
  <div class="hud hud-tr">
   <div class="layseg glass" id="layseg"><button data-l="basic"><i class="fa-solid fa-layer-group"></i>Základní</button><button data-l="light">Světlá</button><button data-l="sat">Letecká</button></div>
   <div class="layers" id="layers">
    <button class="lay on" data-l="basic"><span id="lay-basic"></span><em>Základní</em></button>
    <button class="lay" data-l="light"><span id="lay-light"></span><em>Světlá</em></button>
    <button class="lay" data-l="sat"><span id="lay-sat"></span><em>Letecká</em></button>
   </div>
   <div class="fx3d">
    <button class="hbtn" id="ride-go" title="Jízda vozidlem ve 3D"><i class="fa-solid fa-cubes"></i><span>Jízda vozidlem</span></button>
    <div class="seg glass" id="fx-time"><button data-v="auto" title="Podle skutečnosti"><i class="fa-solid fa-clock-rotate-left"></i></button><button data-v="dawn" title="Svítání"><i class="fa-solid fa-sun"></i><i class="fa-solid fa-arrow-up" style="font-size:8px;margin-left:-3px"></i></button><button data-v="day" title="Den"><i class="fa-solid fa-sun"></i></button><button data-v="dusk" title="Soumrak"><i class="fa-solid fa-sun"></i><i class="fa-solid fa-arrow-down" style="font-size:8px;margin-left:-3px"></i></button><button data-v="night" title="Noc"><i class="fa-solid fa-moon"></i></button></div>
    <div class="seg glass" id="fx-wx"><button data-v="auto" title="Skutečné počasí"><i class="fa-solid fa-satellite-dish"></i></button><button data-v="none" title="Jasno"><i class="fa-solid fa-sun"></i></button><button data-v="cloud" title="Oblačno"><i class="fa-solid fa-cloud"></i></button><button data-v="rain" title="Déšť"><i class="fa-solid fa-cloud-showers-heavy"></i></button><button data-v="snow" title="Sníh"><i class="fa-regular fa-snowflake"></i></button></div>
   </div>
  </div>
  <div class="hud hud-bl">
   <div class="hbtn" id="clock">--:--:--</div>
   <div class="hbtn" id="scale"><span class="sc-tx">1 km</span><span class="sc-bar" style="width:60px"></span></div>
   <button class="hbtn sq" id="compass" title="Sever nahoru"><i class="fa-solid fa-location-arrow" style="transform:rotate(-45deg)"></i></button>
   <button class="hbtn sq" id="legend-btn" title="Legenda"><i class="fa-solid fa-list"></i></button>
   <button class="hbtn sq" id="live-btn" title="Živé polohy"><i class="fa-solid fa-tower-broadcast"></i></button>
   <button class="hbtn" id="weather" title="Počasí" hidden></button>
  </div>
  <div class="hud hud-br">
   <div class="cz-btns">
    <button class="hbtn round" id="btn-cz" title="Celá Česká republika"><i class="fa-solid fa-earth-europe"></i><span>Celá ČR</span></button>
    <button class="hbtn round acc" id="btn-center" title="Vycentrovat"><i class="fa-solid fa-location-crosshairs"></i><span>Vycentrovat</span></button>
   </div>
  </div>
  <div id="m3d-chip" class="glass"><i class="fa-solid fa-tower-broadcast"></i><b>ŽIVĚ</b><span>živé polohy + jízdní řád</span></div>
  <div id="joy" class="glass" title="Otáčet kamerou (dvojklik = sever)"><i class="fa-solid fa-rotate"></i><span id="joy-k"></span></div>
  <button id="ride-x" class="hbtn" title="Ukončit jízdu"><i class="fa-solid fa-xmark"></i></button>
  <button id="ride-ff" class="hbtn" title="2× zrychlit jízdu"><i class="fa-solid fa-forward"></i></button>
  <div id="ride-hud" class="glass"></div>
  <div id="legend" class="glass" hidden></div>
  <div class="loadbar glass" id="loadbar" hidden><span class="spin"></span><span id="loadbar-t">Načítám…</span></div>
 </main>
</div>

<nav id="tabs" class="glass" aria-label="Hlavní nabídka">
 <button data-t="search"><i class="fa-solid fa-magnifying-glass"></i><span>Hledat</span></button>
 <button data-t="dep"><i class="fa-regular fa-clock"></i><span>Odjezdy</span></button>
 <button data-t="ai" class="ai-tab"><i class="fa-solid fa-wand-magic-sparkles"></i><span>Rádce</span></button>
 <button data-t="wx"><i class="fa-solid fa-cloud-sun"></i><span>Počasí</span></button>
 <button data-t="bedekr" class="tb-x"><i class="fa-solid fa-landmark"></i><span>Bedekr</span></button>
 <button data-t="info" class="tb-x"><i class="ri">i</i><span>Info</span></button>
 <button data-t="dark" class="tb-x"><i class="fa-solid fa-moon"></i><span>Tmavý</span></button>
 <button data-t="regio" class="tb-x tg"><i class="fa-solid fa-bus-simple"></i><span>Regio</span></button>
 <button data-t="vlak" class="tb-x tg"><i class="fa-solid fa-train"></i><span>Vlak</span></button>
 <button data-t="more" class="tb-more"><i class="fa-solid fa-ellipsis"></i><span>Více</span></button>
</nav>

<section class="sheet" id="sh-search" aria-hidden="true"></section>
<section class="sheet" id="sh-dep" aria-hidden="true"></section>
<section class="sheet" id="sh-ai" aria-hidden="true"></section>
<section class="sheet" id="sh-wx" aria-hidden="true"></section>
<section class="sheet" id="sh-more" aria-hidden="true"></section>
<section class="sheet" id="sh-misc" aria-hidden="true"></section>
<section id="vcard" aria-hidden="true"></section>
<section class="sheet" id="bedekr" aria-hidden="true"></section>
<div id="toast"></div>
<div id="tip"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
/*@JS@*/
</script>
<script src="https://api.mapbox.com/mapbox-gl-js/v3.15.0/mapbox-gl.js" defer></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js" defer></script>
</body>
</html>
